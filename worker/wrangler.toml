name = "fitgram-app"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Configure once: `wrangler kv namespace create scan-cache`
# Then paste the IDs below.
# [[kv_namespaces]]
# binding = "SCAN_CACHE"
# id = ""
# preview_id = ""

# Admin-only AI usage accounting — see USAGE_DASHBOARD.md for migrations
# + secret rotation.
[[d1_databases]]
binding = "USAGE_DB"
database_name = "fitgram-usage"
database_id = "a762efb2-0937-4fa0-9d84-62fd38844f6d"

[vars]
# Non-secret toggles. Use `wrangler secret put NAME` for the rest:
#   SUPABASE_URL, SUPABASE_JWT_SECRET, GEMINI_API_KEY, UPSTASH_REDIS_URL,
#   UPSTASH_REDIS_TOKEN, APPLE_ISSUER_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY,
#   APPLE_SIWA_KEY_ID, APPLE_SIWA_PRIVATE_KEY
APPLE_BUNDLE_ID = "app.fitgram.ios.bashyrov"
APPLE_TEAM_ID = "L55G3V9NJ3"
ANTHROPIC_BASE_URL = "https://leafapi.cc/"
ANTHROPIC_AUTH_MODE = "bearer"
AI_PROVIDER = "gemini"
CLAUDE_TEXT_MODEL = "claude-sonnet-4-20250514"
CLAUDE_VISION_MODEL = "claude-sonnet-4-20250514"
GEMINI_VISION_MODEL = "gemini-2.5-flash"
# Pro scans use Flash too: Pro was ~4-5x the cost for little visible gain.
GEMINI_PREMIUM_MODEL = "gemini-2.5-flash"
CACHE_TTL_SECONDS = "604800"  # 7 days
LOG_LEVEL = "info"
