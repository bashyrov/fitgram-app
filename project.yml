name: Fitgram

options:
  bundleIdPrefix: app.fitgram
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_ISOLATED_DEFAULT_VALUES: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: "L55G3V9NJ3"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "17"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_TESTABILITY: NO

configs:
  Debug: debug
  Release: release

targets:
  Fitgram:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Fitgram
        excludes:
          - "Resources/Mock/**"
      - path: Shared
    dependencies:
      - target: FitgramWidget
        embed: true
        codeSign: true
    resources:
      - path: Fitgram/Resources/Assets.xcassets
      - path: Fitgram/Resources/Seeds
      - path: Fitgram/Resources/Fonts
    info:
      path: Fitgram/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Fitgram
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            UIPrerenderedIcon: false
          CFBundleAlternateIcons:
            AppIconGraphiteLime:
              CFBundleIconName: AppIconGraphiteLime
              UIPrerenderedIcon: false
            AppIconGraphiteLimeInverted:
              CFBundleIconName: AppIconGraphiteLimeInverted
              UIPrerenderedIcon: false
            AppIconOceanNight:
              CFBundleIconName: AppIconOceanNight
              UIPrerenderedIcon: false
            AppIconOceanNightLight:
              CFBundleIconName: AppIconOceanNightLight
              UIPrerenderedIcon: false
            AppIconOceanDay:
              CFBundleIconName: AppIconOceanDay
              UIPrerenderedIcon: false
            AppIconCitrusWhite:
              CFBundleIconName: AppIconCitrusWhite
              UIPrerenderedIcon: false
            AppIconCitrusWhiteSoft:
              CFBundleIconName: AppIconCitrusWhiteSoft
              UIPrerenderedIcon: false
            AppIconDaylightLime:
              CFBundleIconName: AppIconDaylightLime
              UIPrerenderedIcon: false
            AppIconPorcelainCoral:
              CFBundleIconName: AppIconPorcelainCoral
              UIPrerenderedIcon: false
            AppIconMatchaCeramic:
              CFBundleIconName: AppIconMatchaCeramic
              UIPrerenderedIcon: false
            AppIconNordicBerry:
              CFBundleIconName: AppIconNordicBerry
              UIPrerenderedIcon: false
        CFBundleLocalizations:
          - pl
          - en
          - uk
          - ru
          - es
        UILaunchScreen:
          UIColorName: BrandBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        UIBackgroundModes:
          - remote-notification
        UIUserInterfaceStyle: Automatic
        NSCameraUsageDescription: "Fitgram używa aparatu, żeby rozpoznawać Twoje posiłki na zdjęciach."
        NSPhotoLibraryUsageDescription: "Fitgram potrzebuje dostępu do zdjęć, aby analizować posiłki z biblioteki."
        NSPhotoLibraryAddUsageDescription: "Fitgram zapisuje wygenerowane karty (np. seria) do Twojej biblioteki zdjęć."
        NSMicrophoneUsageDescription: "Fitgram używa mikrofonu do szybkiego dodawania posiłków głosem."
        NSSpeechRecognitionUsageDescription: "Fitgram używa rozpoznawania mowy, aby zamienić Twoją wypowiedź w wpis posiłku."
        NSHealthShareUsageDescription: "Fitgram synchronizuje aktywność i wagę z Apple Health."
        NSHealthUpdateUsageDescription: "Fitgram zapisuje posiłki i kalorie w Apple Health."
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Agbalumo-Regular.ttf
          - Archivo-Variable.ttf
          - Archivo-Italic-Variable.ttf
          - Manrope-Variable.ttf
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.fitgram.auth
            CFBundleURLSchemes:
              - fitgram
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.fitgram.google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.849312185535-mlidbn8lrhfdsro4f9t2a1ruuqmucgi3
        WORKER_BASE_URL: $(WORKER_BASE_URL)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        GOOGLE_OAUTH_CLIENT_ID: $(GOOGLE_OAUTH_CLIENT_ID)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        IS_PAYMENTS_ENABLED: $(IS_PAYMENTS_ENABLED)
    entitlements:
      path: Fitgram/Supporting/Fitgram.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.fitgram.ios.bashyrov
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.app.fitgram.ios.bashyrov
        com.apple.security.application-groups:
          - group.app.fitgram.shared
        com.apple.developer.healthkit: true
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fitgram.ios.bashyrov
        PRODUCT_NAME: Fitgram
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconGraphiteLime AppIconGraphiteLimeInverted AppIconOceanNight AppIconOceanNightLight AppIconOceanDay AppIconCitrusWhite AppIconCitrusWhiteSoft AppIconDaylightLime AppIconPorcelainCoral AppIconMatchaCeramic AppIconNordicBerry"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandPrimary
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: Fitgram/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fitgram/Supporting/Fitgram.entitlements
        WORKER_BASE_URL: "https://fitgram-app.bashyroov.workers.dev"
        SUPABASE_URL: "https://rrkvandbftozmwwfpfqi.supabase.co"
        SUPABASE_ANON_KEY: "sb_publishable_qVVIG9LKOXpTzIQAN8ve2w_-i26wrMl"
        GOOGLE_OAUTH_CLIENT_ID: "849312185535-mlidbn8lrhfdsro4f9t2a1ruuqmucgi3.apps.googleusercontent.com"
        REVENUECAT_API_KEY: ""
        IS_PAYMENTS_ENABLED: "true"

  FitgramWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitgramWidget
      - path: Shared
      - path: Fitgram/Resources/Localizable.xcstrings
    entitlements:
      path: FitgramWidget/FitgramWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.fitgram.shared
    info:
      path: FitgramWidget/Info.plist
      properties:
        CFBundleDisplayName: Fitgram
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - pl
          - en
          - uk
          - ru
          - es
        CFBundleDevelopmentRegion: en
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fitgram.ios.bashyrov.widget
        PRODUCT_NAME: FitgramWidget
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FitgramWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: FitgramWidget/FitgramWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandPrimary

  FitgramWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: FitgramWatch
      - path: Shared
        excludes:
          - FitgramActivityAttributes.swift
    resources:
      - path: FitgramWatch/Assets.xcassets
    info:
      path: FitgramWatch/Info.plist
      properties:
        CFBundleDisplayName: Fitgram
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.fitgram.ios.bashyrov
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fitgram.ios.bashyrov.watchkitapp
        PRODUCT_NAME: FitgramWatch
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FitgramWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandPrimary
        IPHONEOS_DEPLOYMENT_TARGET: ""
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  FitgramTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FitgramTests
    dependencies:
      - target: Fitgram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fitgram.ios.bashyrov.tests
        GENERATE_INFOPLIST_FILE: YES

  FitgramUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FitgramUITests
    dependencies:
      - target: Fitgram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fitgram.ios.bashyrov.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FitgramWatch:
    build:
      targets:
        FitgramWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Fitgram:
    build:
      targets:
        Fitgram: all
        FitgramTests: [test]
        FitgramUITests: [test]
    run:
      config: Debug
      # Local StoreKit Configuration — when DEBUG, in-app purchases go
      # through the fake products defined in Fitgram.storekit so we can
      # test paywall + restore without App Store Connect being wired.
      storeKitConfiguration: Fitgram/Supporting/Fitgram.storekit
      commandLineArguments:
        "-FIRDebugEnabled": false
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Fitgram
      targets:
        - FitgramTests
        - FitgramUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
