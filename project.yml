name: Mealgram

options:
  bundleIdPrefix: app.mealgram
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_ISOLATED_DEFAULT_VALUES: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_TESTABILITY: NO

configs:
  Debug: debug
  Release: release

targets:
  Mealgram:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mealgram
        excludes:
          - "Resources/Mock/**"
    resources:
      - path: Mealgram/Resources/Assets.xcassets
      - path: Mealgram/Resources/Seeds
    info:
      path: Mealgram/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Mealgram
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations:
          - pl
          - en
          - uk
        UILaunchScreen:
          UIColorName: BrandBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        UIUserInterfaceStyle: Automatic
        NSCameraUsageDescription: "Mealgram używa aparatu, żeby rozpoznawać Twoje posiłki na zdjęciach."
        NSPhotoLibraryUsageDescription: "Mealgram potrzebuje dostępu do zdjęć, aby analizować posiłki z biblioteki."
        NSMicrophoneUsageDescription: "Mealgram używa mikrofonu do szybkiego dodawania posiłków głosem."
        NSSpeechRecognitionUsageDescription: "Mealgram używa rozpoznawania mowy, aby zamienić Twoją wypowiedź w wpis posiłku."
        NSHealthShareUsageDescription: "Mealgram synchronizuje aktywność i wagę z Apple Health."
        NSHealthUpdateUsageDescription: "Mealgram zapisuje posiłki i kalorie w Apple Health."
        NSUserTrackingUsageDescription: "Pozwól na śledzenie, żeby otrzymywać spersonalizowane podpowiedzi."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
    entitlements:
      path: Mealgram/Supporting/Mealgram.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mealgram.ios
        PRODUCT_NAME: Mealgram
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandPrimary
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: Mealgram/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mealgram/Supporting/Mealgram.entitlements

  MealgramTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MealgramTests
    dependencies:
      - target: Mealgram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mealgram.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  MealgramUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MealgramUITests
    dependencies:
      - target: Mealgram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mealgram.ios.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Mealgram:
    build:
      targets:
        Mealgram: all
        MealgramTests: [test]
        MealgramUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-FIRDebugEnabled": false
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Mealgram
      targets:
        - MealgramTests
        - MealgramUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
