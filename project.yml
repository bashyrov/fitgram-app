name: Mealgram

options:
  bundleIdPrefix: app.mealgram
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_ISOLATED_DEFAULT_VALUES: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: "L55G3V9NJ3"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_TESTABILITY: NO

configs:
  Debug: debug
  Release: release

targets:
  Mealgram:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mealgram
        excludes:
          - "Resources/Mock/**"
      - path: Shared
    dependencies:
      - target: MealgramWidget
        embed: true
        codeSign: true
    resources:
      - path: Mealgram/Resources/Assets.xcassets
      - path: Mealgram/Resources/Seeds
      - path: Mealgram/Resources/Fonts
    info:
      path: Mealgram/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Mealgram
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - pl
          - en
          - uk
          - ru
          - es
        UILaunchScreen:
          UIColorName: BrandBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        UIBackgroundModes:
          - remote-notification
        UIUserInterfaceStyle: Automatic
        NSCameraUsageDescription: "Mealgram używa aparatu, żeby rozpoznawać Twoje posiłki na zdjęciach."
        NSPhotoLibraryUsageDescription: "Mealgram potrzebuje dostępu do zdjęć, aby analizować posiłki z biblioteki."
        NSPhotoLibraryAddUsageDescription: "Mealgram zapisuje wygenerowane karty (np. seria) do Twojej biblioteki zdjęć."
        NSMicrophoneUsageDescription: "Mealgram używa mikrofonu do szybkiego dodawania posiłków głosem."
        NSSpeechRecognitionUsageDescription: "Mealgram używa rozpoznawania mowy, aby zamienić Twoją wypowiedź w wpis posiłku."
        NSHealthShareUsageDescription: "Mealgram synchronizuje aktywność i wagę z Apple Health."
        NSHealthUpdateUsageDescription: "Mealgram zapisuje posiłki i kalorie w Apple Health."
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Agbalumo-Regular.ttf
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.mealgram.auth
            CFBundleURLSchemes:
              - mealgram
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.mealgram.google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.849312185535-mlidbn8lrhfdsro4f9t2a1ruuqmucgi3
        WORKER_BASE_URL: $(WORKER_BASE_URL)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        GOOGLE_OAUTH_CLIENT_ID: $(GOOGLE_OAUTH_CLIENT_ID)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        IS_PAYMENTS_ENABLED: $(IS_PAYMENTS_ENABLED)
    entitlements:
      path: Mealgram/Supporting/Mealgram.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.mealgram.ios.bashyrov
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.app.mealgram.ios.bashyrov
        com.apple.security.application-groups:
          - group.app.mealgram.shared
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mealgram.ios.bashyrov
        PRODUCT_NAME: Mealgram
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandPrimary
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: Mealgram/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mealgram/Supporting/Mealgram.entitlements
        WORKER_BASE_URL: "https://mealgram-worker.bashyroov.workers.dev"
        SUPABASE_URL: "https://rrkvandbftozmwwfpfqi.supabase.co"
        SUPABASE_ANON_KEY: "sb_publishable_qVVIG9LKOXpTzIQAN8ve2w_-i26wrMl"
        GOOGLE_OAUTH_CLIENT_ID: "849312185535-mlidbn8lrhfdsro4f9t2a1ruuqmucgi3.apps.googleusercontent.com"
        REVENUECAT_API_KEY: ""
        IS_PAYMENTS_ENABLED: "true"

  MealgramWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MealgramWidget
      - path: Shared
      - path: Mealgram/Resources/Localizable.xcstrings
    entitlements:
      path: MealgramWidget/MealgramWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.mealgram.shared
    info:
      path: MealgramWidget/Info.plist
      properties:
        CFBundleDisplayName: Mealgram
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - pl
          - en
          - uk
          - ru
          - es
        CFBundleDevelopmentRegion: en
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mealgram.ios.bashyrov.widget
        PRODUCT_NAME: MealgramWidget
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MealgramWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MealgramWidget/MealgramWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandPrimary

  MealgramWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: MealgramWatch
      - path: Shared
        excludes:
          - MealgramActivityAttributes.swift
    resources:
      - path: MealgramWatch/Assets.xcassets
    info:
      path: MealgramWatch/Info.plist
      properties:
        CFBundleDisplayName: Mealgram
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.mealgram.ios.bashyrov
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mealgram.ios.bashyrov.watchkitapp
        PRODUCT_NAME: MealgramWatch
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MealgramWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BrandPrimary
        IPHONEOS_DEPLOYMENT_TARGET: ""
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  MealgramTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MealgramTests
    dependencies:
      - target: Mealgram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mealgram.ios.bashyrov.tests
        GENERATE_INFOPLIST_FILE: YES

  MealgramUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MealgramUITests
    dependencies:
      - target: Mealgram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mealgram.ios.bashyrov.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MealgramWatch:
    build:
      targets:
        MealgramWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Mealgram:
    build:
      targets:
        Mealgram: all
        MealgramTests: [test]
        MealgramUITests: [test]
    run:
      config: Debug
      # Local StoreKit Configuration — when DEBUG, in-app purchases go
      # through the fake products defined in Mealgram.storekit so we can
      # test paywall + restore without App Store Connect being wired.
      storeKitConfiguration: Mealgram/Supporting/Mealgram.storekit
      commandLineArguments:
        "-FIRDebugEnabled": false
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Mealgram
      targets:
        - MealgramTests
        - MealgramUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
