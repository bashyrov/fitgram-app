disabled_rules:
  - trailing_whitespace
  - todo
  # swift-format always emits trailing commas; we let it own that style.
  - trailing_comma
  # Misfires on URLProtocol overrides — Swift requires `class func` to
  # override a parent `class func`, even inside a `final class`.
  - static_over_final_class

opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  # `redundant_type_annotation` removed: SwiftData @Model classes
  # require explicit type annotations on stored properties, so the rule
  # produces unfixable noise across every model file.
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

excluded:
  - .build
  - DerivedData
  - build
  - Mealgram/Resources/Mock

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 60
  error: 120

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
    - to

force_cast: error
force_try: error
force_unwrapping:
  severity: error

reporter: "xcode"
