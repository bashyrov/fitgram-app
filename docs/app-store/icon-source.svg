<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Mealgram icon: soft sage gradient background + cream leaf glyph -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9DBFA9"/>
      <stop offset="100%" stop-color="#7BA590"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FAF7F2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FAF7F2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background (App Store applies the mask, but we render
       full-bleed so any rounding looks consistent) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Leaf glyph: simple silhouette, cream/off-white, slightly tilted -->
  <g transform="translate(512 540) rotate(-12)">
    <!-- Outer leaf shape -->
    <path d="
      M 0 -280
      C 160 -240, 240 -100, 240 80
      C 240 220, 140 320, 0 320
      C -140 320, -240 220, -240 80
      C -240 -100, -160 -240, 0 -280
      Z"
      fill="#FAF7F2"
      stroke="none"/>
    <!-- Central vein -->
    <path d="M 0 -260 L 0 310" stroke="#9DBFA9" stroke-width="14" stroke-linecap="round"/>
    <!-- Side veins, soft sage -->
    <g stroke="#9DBFA9" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M 0 -160 C 60 -130, 90 -90, 110 -40"/>
      <path d="M 0 -160 C -60 -130, -90 -90, -110 -40"/>
      <path d="M 0 -40 C 80 0, 130 60, 160 130"/>
      <path d="M 0 -40 C -80 0, -130 60, -160 130"/>
      <path d="M 0 100 C 70 130, 110 190, 130 250"/>
      <path d="M 0 100 C -70 130, -110 190, -130 250"/>
    </g>
  </g>
</svg>
